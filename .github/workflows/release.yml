name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名密钥（应用内自动更新用；丢失后旧版本将无法自动升级）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SciTrail ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          # 生成并上传 latest.json，客户端凭它发现新版本
          includeUpdaterJson: true
          releaseBody: |
            科迹 SciTrail —— 本地优先的博士生科研轨迹与任务管理器。

            **v0.1.5**
            - 🇨🇳 安装器中文化：中文系统自动显示中文安装界面（英文系统仍为英文）
            - 🖥 安装完成页「创建桌面快捷方式」默认不勾选，需要时可手动勾选
            - 🔄 v0.1.4 起内置自动更新：旧版本启动后会自动发现本版并可一键升级（下载 → 签名校验 → 安装 → 重启）

            **v0.1.4**
            - 🔄 应用内自动更新上线：启动自动检查 + 右下角升级横幅 + 设置页手动检查；更新包经 minisign 签名校验后安装
            - 🧹 代码精简：抽屉组件（FormDrawer）与全局共享样式（ui.css）收拢，净减约 500 行重复代码；抽屉统一支持 Esc 关闭

            **v0.1.3**
            - 🎨 全新应用图标与品牌标识：S 形蜿蜒轨迹 · 两个足迹点 · 终点目标环
            - 🔐 Release 附带 `sha256.txt`，下载后可核对安装包哈希（`Get-FileHash`）

            **v0.1.2（M1 + M2 功能全量）**
            - M1 骨架：任务/课题/DDL/里程碑 · 轨迹账本（UNION 投影 · 检查器 · 修改历史）· 周报一键生成 · 每日自动备份与一键恢复
            - M2：📈 回顾页 · 📄 论文投稿流水线 · 🏆 成果库与毕业要求对照 · 💰 报销垫付台账
            - ⌨️ 全局速录：Ctrl+Alt+K（`实 完成#催化 1150℃×2h 明天 9:00`）

            Windows 安装包（NSIS）随本 Release 附带；首次启动需设置解锁口令。
            安装时 SmartScreen 提示「更多信息 → 仍要运行」（无签名证书，详见 README）。

      - name: 生成 SHA256 校验文件并附到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $files) { Write-Host "no setup found"; exit 0 }
          $lines = foreach ($f in $files) { "$(Get-FileHash $f.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($f.Name)" }
          $lines | Out-File -Encoding ascii sha256.txt
          Get-Content sha256.txt
          gh release upload ${{ github.ref_name }} sha256.txt --clobber
